name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter scaffold
        run: flutter create --platforms=android --org com.phonemount --project-name phone_mount_bridge scaffold

      - name: Overlay app sources
        run: |
          cp pubspec.yaml scaffold/pubspec.yaml
          rm -rf scaffold/lib scaffold/test
          mkdir -p scaffold/lib scaffold/assets/web scaffold/android/app/src/main/res/xml
          cp main.dart scaffold/lib/main.dart
          cp index.html scaffold/assets/web/index.html
          cp device_filter.xml scaffold/android/app/src/main/res/xml/device_filter.xml
          python3 patch_manifest.py scaffold/android/app/src/main/AndroidManifest.xml

      - name: Get packages and patch plugins for new AGP
        working-directory: scaffold
        run: |
          flutter pub get
          # Newer AGP no longer supports 'proguard-android.txt' (it contains
          # -dontoptimize, which blocks R8 optimizations). Patch any plugin
          # in the pub cache that still uses it.
          grep -rl --include='build.gradle*' "proguard-android.txt" "$HOME/.pub-cache/hosted" 2>/dev/null \
            | while read -r f; do
                echo "Patching $f"
                sed -i "s/proguard-android\.txt/proguard-android-optimize.txt/g" "$f"
              done || true

      - name: Build release APK
        working-directory: scaffold
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: phone-mount-bridge-apk
          path: scaffold/build/app/outputs/flutter-apk/app-release.apk
