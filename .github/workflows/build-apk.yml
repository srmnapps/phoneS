name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter scaffold
        run: flutter create --platforms=android --org com.phonemount --project-name phone_mount_bridge scaffold

      - name: Overlay app sources
        run: |
          cp pubspec.yaml scaffold/pubspec.yaml
          rm -rf scaffold/lib scaffold/test
          mkdir -p scaffold/lib scaffold/assets/web scaffold/android/app/src/main/res/xml
          cp main.dart scaffold/lib/main.dart
          cp index.html scaffold/assets/web/index.html
          cp device_filter.xml scaffold/android/app/src/main/res/xml/device_filter.xml
          python3 patch_manifest.py scaffold/android/app/src/main/AndroidManifest.xml

      - name: Build release APK
        working-directory: scaffold
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: phone-mount-bridge-apk
          path: scaffold/build/app/outputs/flutter-apk/app-release.apk
